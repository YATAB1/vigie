# Local development stack. Copy .env.example to .env before the first run.
name: vigie

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigie}
      POSTGRES_USER: ${POSTGRES_USER:-vigie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Bound to localhost only: reachable from your machine, not from the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build: ./api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigie}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vigie}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      VIGIE_JWT_SECRET: ${VIGIE_JWT_SECRET:?Set VIGIE_JWT_SECRET in .env}
      # The local stack is served over plain HTTP, so cookies cannot be Secure here.
      VIGIE_AUTH_SECURE_COOKIES: "false"
      # Alert emails go to Mailpit locally: open http://localhost:8025 to read them.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      VIGIE_PUBLIC_URL: http://localhost:3000
      VIGIE_ADMIN_EMAIL: ${VIGIE_ADMIN_EMAIL:-}
      VIGIE_ADMIN_PASSWORD: ${VIGIE_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    build: ./worker
    environment:
      VIGIE_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
