spring:
  datasource:
    url: jdbc:h2:mem:vigie;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    # The analytics views use PostgreSQL features that H2 does not support.
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none

vigie:
  auth:
    # Test-only key (48 zero bytes). Never used outside the test suite.
    jwt-secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    secure-cookies: false
  queue:
    # Tests call the result handler directly: no Redis is needed.
    consumer-enabled: false
  schedule:
    # Tests call the scheduling logic directly.
    enabled: false
