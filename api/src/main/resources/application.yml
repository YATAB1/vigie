spring:
  application:
    name: vigie-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vigie}
    username: ${SPRING_DATASOURCE_USERNAME:vigie}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    # No lazy loading while rendering the response: queries happen in services only.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      repositories:
        # Redis is only used as a job queue, not as a Spring Data store.
        enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoint is reachable over HTTP; everything else
        # (env, beans, heapdump...) stays closed.
        include: health

vigie:
  # Replaced by Maven with the version declared in pom.xml.
  version: "@project.version@"
  auth:
    # Base64-encoded HMAC key, at least 32 bytes. No default on purpose:
    # the application refuses to start without it (except in the dev profile).
    jwt-secret: ${VIGIE_JWT_SECRET:}
    issuer: vigie-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # Cookies are only sent over HTTPS. Set to false for local HTTP development.
    secure-cookies: ${VIGIE_AUTH_SECURE_COOKIES:true}
  queue:
    jobs-key: "vigie:jobs"
    results-key: "vigie:results"
    # The background thread that reads worker results from Redis.
    consumer-enabled: true
    # A scan with no result after this delay is marked as failed.
    scan-timeout: 5m
  admin:
    # Optional: creates this administrator at startup if it does not exist yet.
    email: ${VIGIE_ADMIN_EMAIL:}
    password: ${VIGIE_ADMIN_PASSWORD:}
