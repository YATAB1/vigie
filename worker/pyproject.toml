[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigie-worker"
version = "0.1.0"
description = "Scan worker for Vigie: consumes jobs from Redis and runs security checks."
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2,<9",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.26",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
vigie-worker = "vigie_worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vigie_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
